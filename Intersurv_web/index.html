<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InterSurv</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<!-- TOP BUTTONS -->
<div class="top-buttons">

    <button id="btnAbout" class="icon-button">
        ⓘ
    </button>


</div>


<!-- HOME CONTENT -->
<main class="home-content">

    <!-- LOGO -->
    <img
            src="images/app logo.jpg"
            alt="InterSurv Logo"
            class="app-logo"
    >

    <!-- TITLE -->
    <h1>
        Intelligent Survey<br>
        Control Point<br>
        Navigation
    </h1>

    <!-- DIVIDER -->
    <div class="title-line"></div>

    <!-- SUBTITLE -->
    <p class="subtitle">
        Survey control point search, details and navigation
    </p>

    <!-- START BUTTON -->
    <button id="btnStart" class="start-button">
        <span class="button-icon">⌖</span>
        <span>START</span>
        <span class="arrow">→</span>
    </button>

    <!-- ADMIN BUTTON -->
    <button id="btnAdmin" class="admin-button">
        <span>♙</span>
        <span>ADMIN LOGIN</span>
    </button>

</main>


<!-- POLITEKNIK MERLIMAU PHOTO -->
<section class="poly-section">

    <img
            src="images/polyimage.png"
            alt="Politeknik Merlimau Melaka"
            class="poly-image"
    >

</section>


<script src="js/app.js"></script>

</body>
</html>
